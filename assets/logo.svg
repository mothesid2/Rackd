  <text x="150" y="250" text-anchor="middle"
        font-family="'Trebuchet MS','Gill Sans','Segoe UI',Arial,sans-serif"
        font-size="260" font-weight="700" fill="#f4f1e8">R</text>

  <!-- Smoke wisps (sage green) -->
  <g fill="none" stroke="#8d9c5e" stroke-linecap="round">
