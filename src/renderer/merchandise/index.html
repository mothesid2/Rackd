<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rackd POS — Merchandise</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="../shared-ui-kit.css" />
  <style>
    .page-layout {
      padding: 24px;
      padding-bottom: 56px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .menu-card {
      max-width: 560px;
    }

    .menu-card .card-subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="page-layout">
    <div class="page-header">
      <button class="btn btn-back" onclick="navigate('main-menu')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <h1 class="page-title">Merchandise</h1>
    </div>

    <div class="card menu-card">
      <div class="card-title">Manage Inventory &amp; Stock</div>

      <button class="nav-btn inventory-btn" onclick="navigate('merchandise/inventory')">
        <div class="nav-icon-area">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/>
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-title">Inventory</div>
          <div class="nav-subtitle">View and manage stock</div>
        </div>
        <div class="nav-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </button>

      <button class="nav-btn invoice-btn" onclick="navigate('merchandise/receive-invoice')">
        <div class="nav-icon-area">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-title">Receive Invoice</div>
          <div class="nav-subtitle">Enter new stock invoices</div>
        </div>
        <div class="nav-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </button>

      <button class="nav-btn reorder-btn" onclick="navigate('merchandise/reorder')">
        <div class="nav-icon-area">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-title">Reorder Report</div>
          <div class="nav-subtitle">Low stock &amp; what to reorder</div>
        </div>
        <div class="nav-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </button>

      <button class="nav-btn edit-btn" onclick="navigate('merchandise/edit-items')">
        <div class="nav-icon-area">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-title">Edit Items</div>
          <div class="nav-subtitle">Update products and pricing</div>
        </div>
        <div class="nav-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </button>

      <button class="nav-btn categories-btn" onclick="navigate('merchandise/categories')">
        <div class="nav-icon-area">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-8l-2-2H5a2 2 0 0 0-2 2z"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-title">Categories</div>
          <div class="nav-subtitle">Create, rename &amp; assign categories</div>
        </div>
        <div class="nav-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </button>

      <button class="nav-btn pricing-groups-btn" onclick="navigate('pricing-groups')">
        <div class="nav-icon-area">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.2L4 3a1 1 0 0 0-1 1l.2 5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.82 0l4.4-4.4a2 2 0 0 0 0-2.83z"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-title">Pricing Groups</div>
          <div class="nav-subtitle">Shared pricing/tax &amp; group promos</div>
        </div>
        <div class="nav-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </button>

      <button class="nav-btn catalog-btn" onclick="navigate('merchandise/catalog')">
        <div class="nav-icon-area">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="4" x2="9" y2="20"/>
          </svg>
        </div>
        <div class="nav-text">
          <div class="nav-title">Distributor Catalog</div>
        </div>
        <div class="nav-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-left" id="status-left">Loading…</div>
    <div class="status-right" id="status-right"></div>
  </div>

  <script src="../shared.js"></script>
  <script src="../shared-ui-kit.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const { session } = await window.api.getSession();
      if (session?.role !== 'manager') {
        
        document.querySelector('[onclick="navigate(\'merchandise/receive-invoice\')"]')?.setAttribute('style', 'display:none');
        document.querySelector('[onclick="navigate(\'merchandise/edit-items\')"]')?.setAttribute('style', 'display:none');
        document.querySelector('[onclick="navigate(\'merchandise/reorder\')"]')?.setAttribute('style', 'display:none');
        document.querySelector('[onclick="navigate(\'merchandise/catalog\')"]')?.setAttribute('style', 'display:none');
        document.querySelector('[onclick="navigate(\'merchandise/categories\')"]')?.setAttribute('style', 'display:none');
        document.querySelector('[onclick="navigate(\'pricing-groups\')"]')?.setAttribute('style', 'display:none');
      }
    });
  </script>
</body>
</html>
