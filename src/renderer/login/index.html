<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rackd POS — Login</title>
  <link rel="stylesheet" href="../shared.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(130% 120% at 50% 22%, #2b313a 0%, #171b21 48%, #0c0e11 100%);
      background-image: radial-gradient(130% 120% at 50% 22%, #2b313a 0%, #171b21 48%, #0c0e11 100%);
    }

    .login-wrap {
      width: 380px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 20px;
      padding: 32px 0 18px;
    }

    .logo-area .logo-icon {
      width: 200px;
      height: 200px;
      margin: 0 auto 14px;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
      position: relative;
      z-index: 1;
    }

    .logo-area .brand-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.18);
      padding: 32px;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }

    .login-card .form-group {
      margin-bottom: 16px;
    }

    .login-card .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
      margin-bottom: 6px;
    }

    .login-card .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      color: #1a1a1a;
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .login-card .form-group input:focus {
      border-color: #b01d2e;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(176,29,46,0.12);
    }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(180deg, #2a2f37 0%, #1b1d21 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
      margin-top: 8px;
    }

    .btn-login:hover  { filter: brightness(1.15); }
    .btn-login:active { filter: brightness(0.9); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-area">
      <img src="../../../assets/logo-mark.svg" alt="RackD"
           style="width:140px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 6px 16px rgba(0,0,0,0.55))" />
      <div style="font-family:'Tw Cen MT','Century Gothic','Futura','Gill Sans','Segoe UI',sans-serif;font-size:46px;font-weight:500;letter-spacing:6px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,0.45)">
        <span style="color:#ffffff">Rack</span><span style="color:#b01d2e;text-shadow:0 0 6px rgba(176,29,46,0.3)">D</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
        <span style="flex:1;height:1px;background:#b01d2e"></span>
        <span style="font-family:'Tw Cen MT','Century Gothic','Futura','Gill Sans','Segoe UI',sans-serif;font-size:11px;font-weight:400;letter-spacing:4px;color:#d8a8ae;white-space:nowrap">POINT OF SALE SYSTEM</span>
        <span style="flex:1;height:1px;background:#b01d2e"></span>
      </div>
    </div>

    <div class="login-card" id="loginCard">
      <h2 id="loginHeading">Sign In</h2>
      <div id="dayNote" style="display:none;font-size:13px;color:#666;background:#f3f4f6;border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.45"></div>
      <div class="error-msg" id="errorMsg">Invalid PIN</div>

      <!-- PIN pad (primary) -->
      <div id="pinPane">
        <div id="pinDots" style="text-align:center;font-size:26px;letter-spacing:6px;height:34px;color:#333;margin-bottom:8px">– – – –</div>
        <div id="pinKeypad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto"></div>
        <div style="text-align:center;margin-top:14px"><a href="#" id="usePassword" style="font-size:13px;color:#888;text-decoration:none">Use username &amp; password</a></div>
      </div>

      <!-- Username / password (fallback / first-time setup) -->
      <div id="pwPane" style="display:none">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" />
        </div>
        <button class="btn-login" id="loginBtn">Sign In</button>
        <div style="text-align:center;margin-top:12px"><a href="#" id="usePin" style="font-size:13px;color:#888;text-decoration:none">Use PIN</a></div>
      </div>

      <style>
        #pinKeypad .pinkey { border:1px solid #e2e2e2; border-radius:12px; background:#fafafa; font-size:22px; font-weight:700; padding:16px 0; cursor:pointer; }
        #pinKeypad .pinkey:active { background:#eee; }
      </style>
    </div>
  </div>

  <!-- Change password modal (first run) -->
  <div class="modal-overlay" id="changePassModal" style="display:none">
    <div class="modal" style="max-width:420px">
      <div class="modal-title">Change Your Password</div>
      <p style="font-size:14px;color:#666;margin-bottom:20px">
        Please set a new password before continuing.
      </p>
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="cpOld" />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="cpNew" />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="cpConfirm" />
      </div>
      <div class="error-msg" id="cpError" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn btn-navy" id="cpSaveBtn">Save Password</button>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script src="../lib/updateUi.js"></script>
  <script>
    const loginBtn = document.getElementById('loginBtn');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const loginCard = document.getElementById('loginCard');

    async function doLogin() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (!username || !password) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      const res = await window.api.login(username, password);

      if (res.success) {
        if (res.user?.must_change_password) {
          // Server flagged this account — force a password change before entry
          document.getElementById('cpOld').value = password;
          document.getElementById('changePassModal').style.display = 'flex';
          return;
        }
        await window.api.navigate('main-menu');
      } else {
        errorMsg.style.display = 'block';
        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; // reflow
        loginCard.classList.add('shake');
        passwordEl.value = '';
        passwordEl.focus();
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        setTimeout(() => { loginCard.classList.remove('shake'); }, 400);
      }
    }

    loginBtn.addEventListener('click', doLogin);
    passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    usernameEl.addEventListener('keydown', e => { if (e.key === 'Enter') passwordEl.focus(); });

    // ── PIN sign-in ─────────────────────────────────────────────────────────
    let pin = '';
    const pinDots = document.getElementById('pinDots');
    function renderPinDots() { pinDots.textContent = pin ? pin.split('').map(() => '●').join('  ') : '– – – –'; }
    function pinKey(k) {
      document.getElementById('errorMsg').style.display = 'none';
      if (k === '⌫') pin = pin.slice(0, -1);
      else if (k === '✓') return submitPin();
      else if (pin.length < 8) pin += k;
      renderPinDots();
    }
    async function submitPin() {
      if (pin.length < 4) return;
      const res = await window.api.pinLogin(pin);
      if (res.success) { pin = ''; await window.api.navigate('main-menu'); return; }
      const err = document.getElementById('errorMsg');
      err.textContent = res.error || 'Incorrect PIN';
      err.style.display = 'block';
      pin = ''; renderPinDots();
    }
    document.getElementById('pinKeypad').innerHTML =
      ['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(k => `<button class="pinkey" onclick="pinKey('${k}')">${k}</button>`).join('');
    window.pinKey = pinKey;
    renderPinDots();

    const pinPane = document.getElementById('pinPane');
    const pwPane = document.getElementById('pwPane');
    document.getElementById('usePassword').addEventListener('click', (e) => { e.preventDefault(); pinPane.style.display = 'none'; pwPane.style.display = 'block'; usernameEl.focus(); });
    document.getElementById('usePin').addEventListener('click', (e) => { e.preventDefault(); pwPane.style.display = 'none'; pinPane.style.display = 'block'; });
    // Hardware keyboard: type the PIN when the PIN pane is showing.
    document.addEventListener('keydown', (e) => {
      if (pinPane.style.display === 'none') return;
      if (/^[0-9]$/.test(e.key)) pinKey(e.key);
      else if (e.key === 'Backspace') pinKey('⌫');
      else if (e.key === 'Enter') pinKey('✓');
    });

    // Change password flow
    document.getElementById('cpSaveBtn').addEventListener('click', async () => {
      const oldP = document.getElementById('cpOld').value;
      const newP = document.getElementById('cpNew').value;
      const confirmP = document.getElementById('cpConfirm').value;
      const cpError = document.getElementById('cpError');

      if (newP !== confirmP) {
        cpError.textContent = 'Passwords do not match';
        cpError.style.display = 'block';
        return;
      }
      if (newP.length < 6) {
        cpError.textContent = 'Password must be at least 6 characters';
        cpError.style.display = 'block';
        return;
      }
      const res = await window.api.changePassword(oldP, newP);
      if (res.success) {
        document.getElementById('changePassModal').style.display = 'none';
        await window.api.navigate('main-menu');
      } else {
        cpError.textContent = res.error || 'Failed to change password';
        cpError.style.display = 'block';
      }
    });

    // ── Business-day gate (item 2) ───────────────────────────────────────────
    // Day closed  -> a manager must open it with username + password.
    // Day open    -> staff sign in with a PIN.
    const heading = document.getElementById('loginHeading');
    const dayNote = document.getElementById('dayNote');
    const usePasswordLink = document.getElementById('usePassword');

    async function initDayGate() {
      let state = null;
      try { state = await window.api.sessionState(); } catch { /* offline shell */ }
      const dayOpen = state && state.success ? state.dayOpen : true; // default to PIN if unknown
      if (!dayOpen) {
        // Force the manager username/password pane; PIN won't be accepted yet.
        heading.textContent = 'Open the Day';
        dayNote.textContent = 'Start of day: a manager must sign in with a username and password to open the register. Staff can then sign in with their PIN.';
        dayNote.style.display = 'block';
        pinPane.style.display = 'none';
        pwPane.style.display = 'block';
        if (usePasswordLink) usePasswordLink.style.display = 'none';
        // Hide the "Use PIN" link so staff aren't sent to a pad that will be refused.
        const usePinLink = document.getElementById('usePin');
        if (usePinLink) usePinLink.style.display = 'none';
        usernameEl.focus();
      } else {
        heading.textContent = 'Sign In';
        const by = state && state.day && state.day.openedByName;
        if (by) { dayNote.textContent = `Day opened by ${by}. Enter your PIN to sign in.`; dayNote.style.display = 'block'; }
        pinPane.style.display = 'block';
        pwPane.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', initDayGate);
  </script>
</body>
</html>
