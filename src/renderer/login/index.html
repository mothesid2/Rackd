<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rackd POS — Login</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="../shared-ui-kit.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(130% 120% at 50% 22%, #2b313a 0%, #171b21 48%, #0c0e11 100%);
      background-image: radial-gradient(130% 120% at 50% 22%, #2b313a 0%, #171b21 48%, #0c0e11 100%);
    }

    .login-wrap {
      width: 380px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 20px;
      padding: 32px 0 18px;
    }

    .logo-area .logo-icon {
      width: 200px;
      height: 200px;
      margin: 0 auto 14px;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
      position: relative;
      z-index: 1;
    }

    .logo-area .brand-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .login-card {
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.18);
      padding: 32px;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .login-card .form-group {
      margin-bottom: 16px;
    }

    .login-card .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .login-card .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      color: var(--ink);
      background: var(--panel-2);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .login-card .form-group input:focus {
      border-color: var(--accent);
      background: var(--panel);
      box-shadow: 0 0 0 3px rgba(176,29,46,0.12);
    }

    .error-msg {
      background: var(--bad-dim);
      color: var(--bad);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(180deg, #2a2f37 0%, #1b1d21 100%);
      color: var(--panel);
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
      margin-top: 8px;
    }

    .btn-login:hover  { filter: brightness(1.15); }
    .btn-login:active { filter: brightness(0.9); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-area">
      <img src="../../../assets/logo-mark.svg" alt="RackD"
           style="width:140px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 6px 16px rgba(0,0,0,0.55))" />
      <div style="font-family:'Tw Cen MT','Century Gothic','Futura','Gill Sans','Segoe UI',sans-serif;font-size:46px;font-weight:500;letter-spacing:6px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,0.45)">
        <span style="color:var(--panel)">Rack</span><span style="color:var(--accent);text-shadow:0 0 6px rgba(176,29,46,0.3)">D</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
        <span style="flex:1;height:1px;background:var(--accent)"></span>
        <span style="font-family:'Tw Cen MT','Century Gothic','Futura','Gill Sans','Segoe UI',sans-serif;font-size:11px;font-weight:400;letter-spacing:4px;color:#d8a8ae;white-space:nowrap">POINT OF SALE SYSTEM</span>
        <span style="flex:1;height:1px;background:var(--accent)"></span>
      </div>
    </div>

    <div class="login-card" id="loginCard">
      <h2 id="loginHeading">Sign In</h2>
      <div id="dayNote" style="display:none;font-size:13px;color:var(--muted);background:var(--line-soft);border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.45"></div>
      <div class="error-msg" id="errorMsg">Invalid PIN</div>

      
      <div id="pinPane">
        <div class="form-group" id="pinUserPicker" style="margin-bottom:18px">
          <label>Who's signing in?</label>
          <div id="pinUserGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:168px;overflow-y:auto;padding:2px"></div>
          <select id="pinUser" style="display:none">
            <option value="">Select your name…</option>
          </select>
        </div>
        <div id="pinEntry" style="display:none">
          <button type="button" id="pinChangeUser" style="display:flex;align-items:center;gap:8px;background:none;border:none;padding:6px 2px;margin-bottom:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="15 18 9 12 15 6"/></svg>
            <span id="pinActiveName"></span>
          </button>
          <div id="pinDots" style="text-align:center;font-size:26px;letter-spacing:6px;height:34px;color:var(--ink-2);margin-bottom:8px">– – – –</div>
          <div id="pinKeypad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto"></div>
        </div>
        <div style="text-align:center;margin-top:14px"><a href="#" id="usePassword" style="font-size:13px;color:var(--muted);text-decoration:none">Use username &amp; password</a></div>
      </div>

      
      <div id="pwPane" style="display:none">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" />
        </div>
        <button class="btn-login" id="loginBtn">Sign In</button>
        <div style="text-align:center;margin-top:12px"><a href="#" id="usePin" style="font-size:13px;color:var(--muted);text-decoration:none">Use PIN</a></div>
      </div>

      <style>
        #pinKeypad .pinkey { border:1px solid var(--line); border-radius:12px; background:var(--panel-2); font-size:22px; font-weight:700; padding:16px 0; cursor:pointer; }
        #pinKeypad .pinkey:active { background:var(--line); }
        @keyframes pinShake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)} }
        #loginCard.pin-error { animation: pinShake 0.4s ease; }
        #pinDots.pin-error { color: #dc2626 !important; }
        .name-btn {
          min-height: 52px; border: 1.5px solid var(--line); border-radius: 10px;
          background: var(--panel-2); color: var(--ink); font-size: 15px; font-weight: 600;
          padding: 8px 10px; cursor: pointer; transition: border-color 0.14s, background 0.14s;
        }
        .name-btn:hover, .name-btn:active { border-color: var(--accent-line); background: var(--panel); }
      </style>
    </div>
  </div>

  
  <div class="modal-overlay" id="changePassModal" style="display:none">
    <div class="modal" style="max-width:420px">
      <div class="modal-title" id="cpTitle">Set your password &amp; PIN</div>
      <p style="font-size:14px;color:var(--muted);margin-bottom:20px" id="cpSub">
        For security, set your own password and PIN before continuing.
      </p>
      <input type="hidden" id="cpOld" />
      <div id="cpPwFields">
        <div class="form-group">
          <label>New Password (8+ characters)</label>
          <input type="password" id="cpNew" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="cpConfirm" autocomplete="new-password" />
        </div>
      </div>
      <div id="cpPinFields">
        <div class="form-group">
          <label>New PIN (4 digits)</label>
          <input type="password" inputmode="numeric" id="cpPin" maxlength="4" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Confirm New PIN</label>
          <input type="password" inputmode="numeric" id="cpPinConfirm" maxlength="4" autocomplete="off" />
        </div>
      </div>
      <div class="error-msg" id="cpError" style="display:none"></div>
      <div class="modal-actions">
        <button class="btn btn-navy" id="cpSaveBtn">Save &amp; continue</button>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script src="../shared-ui-kit.js"></script>
  <script src="../lib/updateUi.js"></script>
  <script>
    const loginBtn = document.getElementById('loginBtn');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const loginCard = document.getElementById('loginCard');

    async function doLogin() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;
      if (!username || !password) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      const res = await window.api.login(username, password);

      if (res.success) {
        if (res.user?.must_change_password || res.user?.must_change_pin) {
          openForcedChange(!!res.user.must_change_password);
          return;
        }
        await window.api.navigate('main-menu');
      } else {
        errorMsg.style.display = 'block';
        loginCard.classList.remove('shake');
        void loginCard.offsetWidth; 
        loginCard.classList.add('shake');
        passwordEl.value = '';
        passwordEl.focus();
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        setTimeout(() => { loginCard.classList.remove('shake'); }, 400);
      }
    }

    loginBtn.addEventListener('click', doLogin);
    passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    usernameEl.addEventListener('keydown', e => { if (e.key === 'Enter') passwordEl.focus(); });

    
    
    
    
    
    let pin = '';
    let selectedPinUserId = null;
    const pinDots = document.getElementById('pinDots');
    const pinUserGrid = document.getElementById('pinUserGrid');
    const pinUserPicker = document.getElementById('pinUserPicker');
    const pinEntry = document.getElementById('pinEntry');
    const pinActiveName = document.getElementById('pinActiveName');
    function renderPinDots() { pinDots.textContent = pin ? pin.split('').map(() => '●').join('  ') : '– – – –'; }

    function selectPinUser(id, name) {
      selectedPinUserId = id;
      pinActiveName.textContent = name;
      pinUserPicker.style.display = 'none';
      pinEntry.style.display = 'block';
      pin = ''; renderPinDots();
    }
    document.getElementById('pinChangeUser').addEventListener('click', () => {
      selectedPinUserId = null;
      pinEntry.style.display = 'none';
      pinUserPicker.style.display = 'block';
    });

    
    async function loadPinUsers() {
      selectedPinUserId = null;
      pinEntry.style.display = 'none';
      pinUserPicker.style.display = 'block';
      try {
        const r = await window.api.listPinUsers();
        if (!r || !r.success) return;
        pinUserGrid.innerHTML = r.users.length
          ? r.users.map(u => `<button type="button" class="name-btn" data-id="${u.id}" data-name="${esc(u.name)}">${esc(u.name)}</button>`).join('')
          : '<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:8px">No accounts yet</div>';
        pinUserGrid.querySelectorAll('.name-btn').forEach((b) => {
          b.addEventListener('click', () => selectPinUser(Number(b.dataset.id), b.dataset.name));
        });
      } catch {  }
    }

    function pinKey(k) {
      document.getElementById('errorMsg').style.display = 'none';
      if (k === '⌫') { pin = pin.slice(0, -1); renderPinDots(); return; }
      if (k === '✓') return submitPin();
      if (pin.length < 4) pin += k;
      renderPinDots();
      if (pin.length === 4) submitPin(); 
    }
    
    
    
    function flashPinError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = msg || 'Incorrect PIN'; err.style.display = 'block';
      pin = ''; renderPinDots();
      const card = document.getElementById('loginCard');
      const dots = document.getElementById('pinDots');
      card.classList.remove('pin-error'); dots.classList.remove('pin-error');
      void card.offsetWidth;
      card.classList.add('pin-error'); dots.classList.add('pin-error');
      setTimeout(() => { card.classList.remove('pin-error'); dots.classList.remove('pin-error'); }, 400);
    }
    async function submitPin() {
      if (pin.length !== 4) return;
      const userId = selectedPinUserId;
      if (!userId) {
        const err = document.getElementById('errorMsg');
        err.textContent = 'Select your name first.'; err.style.display = 'block';
        pin = ''; renderPinDots(); return;
      }
      const res = await window.api.pinLogin(userId, pin);
      if (res.success) {
        pin = '';
        if (res.user?.must_change_pin || res.user?.must_change_password) {
          openForcedChange(!!res.user.must_change_password);
          renderPinDots();
          return;
        }
        await window.api.navigate('main-menu'); return;
      }
      flashPinError(res.error);
    }

    
    
    
    
    function openForcedChange(needsPassword) {
      document.getElementById('cpPwFields').style.display = needsPassword ? 'block' : 'none';
      document.getElementById('cpPinFields').style.display = 'block';
      document.getElementById('cpTitle').textContent = needsPassword ? 'Set your password & PIN' : 'Set your PIN';
      document.getElementById('cpSub').textContent = needsPassword
        ? 'For security, set your own password and PIN before continuing.'
        : 'For security, set your own PIN before continuing.';
      document.getElementById('cpError').style.display = 'none';
      document.getElementById('changePassModal').style.display = 'flex';
    }
    document.getElementById('pinKeypad').innerHTML =
      ['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(k => `<button class="pinkey" onclick="pinKey('${k}')">${k}</button>`).join('');
    window.pinKey = pinKey;
    renderPinDots();

    const pinPane = document.getElementById('pinPane');
    const pwPane = document.getElementById('pwPane');
    document.getElementById('usePassword').addEventListener('click', (e) => { e.preventDefault(); pinPane.style.display = 'none'; pwPane.style.display = 'block'; usernameEl.focus(); });
    document.getElementById('usePin').addEventListener('click', (e) => { e.preventDefault(); pwPane.style.display = 'none'; pinPane.style.display = 'block'; loadPinUsers(); });
    
    document.addEventListener('keydown', (e) => {
      if (pinPane.style.display === 'none') return;
      if (/^[0-9]$/.test(e.key)) pinKey(e.key);
      else if (e.key === 'Backspace') pinKey('⌫');
      else if (e.key === 'Enter') pinKey('✓');
    });

    
    document.getElementById('cpSaveBtn').addEventListener('click', async () => {
      const cpError = document.getElementById('cpError');
      const needsPassword = document.getElementById('cpPwFields').style.display !== 'none';
      const needsPin = document.getElementById('cpPinFields').style.display !== 'none';
      const fail = (m) => { cpError.textContent = m; cpError.style.display = 'block'; };

      let newPassword, newPin;
      if (needsPassword) {
        newPassword = document.getElementById('cpNew').value;
        if (newPassword.length < 8) return fail('Password must be at least 8 characters');
        if (newPassword !== document.getElementById('cpConfirm').value) return fail('Passwords do not match');
      }
      if (needsPin) {
        newPin = document.getElementById('cpPin').value;
        if (!/^\d{4}$/.test(newPin)) return fail('PIN must be exactly 4 digits');
        if (newPin !== document.getElementById('cpPinConfirm').value) return fail('PINs do not match');
      }
      const res = await window.api.completeFirstLogin({ newPassword, newPin });
      if (res.success) {
        document.getElementById('changePassModal').style.display = 'none';
        await window.api.navigate('main-menu');
      } else {
        fail(res.error || 'Could not save. Try again.');
      }
    });

    
    
    
    
    
    
    
    
    
    
    
    
    
    document.addEventListener('DOMContentLoaded', () => {
      pinPane.style.display = 'block';
      pwPane.style.display = 'none';
      loadPinUsers();
    });
  </script>
</body>
</html>
