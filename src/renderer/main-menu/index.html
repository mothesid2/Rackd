<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rackd POS — Main Menu</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="../shared-ui-kit.css" />
  <style>
    
    :root {
      --ink: #eaf0ff; --muted: #8fa3c8; --line: rgba(120,150,220,0.16);
      --accent: #c8283a; --accent-bright: #e0364a;
      --smoke: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27520%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27s%27%20x%3D%270%27%20y%3D%270%27%20width%3D%27100%25%27%20height%3D%27100%25%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.0035%200.009%27%20numOctaves%3D%273%27%20seed%3D%2711%27%20result%3D%27n%27%2F%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.012%27%20numOctaves%3D%272%27%20seed%3D%273%27%20result%3D%27d%27%2F%3E%3CfeDisplacementMap%20in%3D%27n%27%20in2%3D%27d%27%20scale%3D%2795%27%20xChannelSelector%3D%27R%27%20yChannelSelector%3D%27G%27%20result%3D%27w%27%2F%3E%3CfeColorMatrix%20in%3D%27w%27%20type%3D%27matrix%27%20values%3D%270%200%200%200%200.86%20%200%200%200%200%200.92%20%200%200%200%200%201%20%200%200%200%201.7%20-0.62%27%2F%3E%3CfeGaussianBlur%20stdDeviation%3D%273%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url(%23s)%27%2F%3E%3C%2Fsvg%3E");
    }
    html, body { background: #05080f; background-image: none; }
    body {
      overflow: hidden;
      background:
        radial-gradient(900px 520px at 12% -8%, rgba(38,84,190,0.28), transparent 62%),
        radial-gradient(760px 480px at 100% 110%, rgba(90,30,120,0.22), transparent 60%),
        linear-gradient(180deg, #080d1a 0%, #05080f 55%, #03050a 100%);
    }

    .launcher {
      height: calc(100vh - 44px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 26px 16px;
    }

    .lch-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .stat {
      position: relative; overflow: hidden;
      background: linear-gradient(180deg, rgba(24,38,72,0.92) 0%, rgba(11,19,40,0.94) 100%);
      border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 18px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 10px 26px -14px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.09);
    }
    .stat::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 42%, transparent 43%);
    }
    .stat > * { position: relative; }
    .stat .ic {
      width: 46px; height: 46px; border-radius: 12px; flex: 0 0 auto; display: grid; place-items: center; color: #fff;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -3px 6px rgba(0,0,0,0.3), 0 4px 10px -3px rgba(0,0,0,0.6);
    }
    .stat .ic svg { width: 24px; height: 24px; }
    .stat.revenue .ic { background: linear-gradient(150deg, #23a05c 0%, #0f5a33 100%); }
    .stat.profit  .ic { background: linear-gradient(150deg, #d4304f 0%, #8a1830 100%); }
    .stat.sales   .ic { background: linear-gradient(150deg, #4a52e0 0%, #262d9c 100%); }
    .stat .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .stat .val { font-size: 25px; font-weight: 800; color: #fff; line-height: 1.05; font-variant-numeric: tabular-nums; }

    @keyframes smoke-drift { from { transform: translate3d(-5%, 0, 0); } to { transform: translate3d(5%, -3%, 0); } }

    .new-sale {
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; height: 66px; border: 1px solid rgba(120,170,255,0.35); border-radius: 14px; cursor: pointer;
      color: #fff; font-size: 21px; font-weight: 800; letter-spacing: 0.4px;
      background: linear-gradient(180deg, #2f6df0 0%, #1b4fc6 48%, #10318a 100%);
      box-shadow: 0 8px 22px -8px rgba(30,90,230,0.55), 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.25);
      text-shadow: 0 1px 3px rgba(0,0,0,0.4); transition: filter 0.14s, transform 0.1s;
    }
    .new-sale::before {
      content: ''; position: absolute; inset: -20% -10%; pointer-events: none; opacity: 0.38; mix-blend-mode: screen;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
      background: var(--smoke) center / 100% 240% no-repeat;
      animation: smoke-drift 22s ease-in-out infinite alternate;
    }
    .new-sale::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 46%, transparent 47%);
    }
    .new-sale > * { position: relative; z-index: 2; }
    .new-sale svg { width: 27px; height: 27px; }
    .new-sale:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .new-sale:active { filter: brightness(0.94); transform: translateY(0); }

    .tile-grid {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 1fr;
      gap: 14px;
    }
    .tile {
      --t1: #1a4a8e; --t2: #0e2c5e; --t3: #081a3c; --i1: #3f7cf2; --i2: #1c4bb8; --glow: 60,120,240; --sx: 0%;
      position: relative; overflow: hidden; cursor: pointer;
      border: 1px solid rgba(var(--glow), 0.28); border-radius: 18px; padding: 20px 22px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px;
      background: linear-gradient(180deg, var(--t1) 0%, var(--t2) 52%, var(--t3) 100%);
      box-shadow: 0 10px 24px -10px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(0,0,0,0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }
    .tile::before {
      content: ''; position: absolute; inset: -12% -8%; pointer-events: none; opacity: 0.44; mix-blend-mode: screen;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 34%, #000 66%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 34%, #000 66%, transparent 100%);
      background: var(--smoke) var(--sx) 60% / 560px auto no-repeat;
      animation: smoke-drift 26s ease-in-out infinite alternate;
    }
    .tile::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background:
        radial-gradient(120% 55% at 50% 0%, rgba(255,255,255,0.13), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.04) 38%, transparent 39%);
    }
    .tile > div, .tile > .t-arrow { position: relative; z-index: 2; }
    .tile:hover { transform: translateY(-3px); border-color: rgba(var(--glow), 0.55); box-shadow: 0 18px 34px -10px rgba(var(--glow), 0.45), 0 10px 24px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.2); }
    .tile:active { transform: translateY(-1px); }

    .tile .t-ic {
      width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
      background: radial-gradient(circle at 50% 30%, var(--i1) 0%, var(--i2) 100%);
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.38), inset 0 -4px 8px rgba(0,0,0,0.35), 0 6px 16px -4px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .tile .t-ic svg { width: 42px; height: 42px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35)); }
    .tile .t-title { position: relative; display: inline-block; font-size: 21px; font-weight: 700; color: #fff; line-height: 1.15; padding-bottom: 9px; }
    .tile .t-title::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 38px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.75), rgba(255,255,255,0.15)); }
    .tile .t-sub { font-size: 13px; color: rgba(255,255,255,0.62); margin-top: 8px; }
    .tile .t-arrow { position: absolute; top: 50%; right: 18px; transform: translateY(-50%); color: #fff; opacity: 0.7; }
    .tile .t-arrow svg { width: 22px; height: 22px; }

    .tile-receipts { --sx: -6%; }
    .tile-merchandise { --t1: #2e2a86; --t2: #1c1958; --t3: #110f3a; --i1: #7a58f0; --i2: #4529b8; --glow: 122,92,240; --sx: 10%; }
    .tile-customer-lookup { --t1: #6a182b; --t2: #440f1d; --t3: #2b0913; --i1: #e03a58; --i2: #97192f; --glow: 224,58,88; --sx: -14%; }
    .tile-timeclock { --t1: #0f5560; --t2: #0a3641; --t3: #06222b; --i1: #1fb3ba; --i2: #0d6f78; --glow: 31,179,186; --sx: 6%; }
    .tile-pickups { --t1: #4a2274; --t2: #2e1352; --t3: #1c0a36; --i1: #b058e8; --i2: #702aa8; --glow: 176,88,232; --sx: -10%; }
    .tile-xzout { --t1: #17458c; --t2: #0d2a5e; --t3: #08183a; --i1: #3a86f4; --i2: #1b52bc; --glow: 58,134,244; --sx: 14%; }
    .tile-settings { --t1: #2a3346; --t2: #1a212f; --t3: #10151f; --i1: #6a7692; --i2: #38415a; --glow: 120,140,180; --sx: -4%; }
    .tile.exit { --t1: #6a1824; --t2: #45101a; --t3: #2a0a10; --i1: #e03a52; --i2: #93192d; --glow: 224,58,82; --sx: 8%; }

    .fullscreen-btn {
      position: fixed; top: 10px; right: 12px; z-index: 300;
      background: rgba(27,30,34,0.78); border: 1px solid rgba(255,255,255,0.14); border-radius: 5px;
      color: rgba(255,255,255,0.7); cursor: pointer; padding: 0; width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; backdrop-filter: blur(4px);
    }
    .fullscreen-btn:hover { background: rgba(176,29,46,0.9); color: #fff; }
    .fullscreen-btn svg { width: 15px; height: 15px; }

    .status-bar { background: linear-gradient(180deg, #0a1020 0%, #05080f 100%); border-top: 1px solid rgba(120,150,220,0.14); }
    .status-bar .status-role, .status-bar .status-time { color: #7fb0ff; }

    @media (max-height: 760px) { .tile .t-ic { width: 68px; height: 68px; } .tile .t-ic svg { width: 34px; height: 34px; } .tile .t-title { font-size: 19px; } .new-sale { height: 56px; } .tile { padding: 14px 18px; gap: 10px; } }
    @media (prefers-reduced-motion: reduce) { .tile, .new-sale { transition: none; } .tile::before, .new-sale::before { animation: none; } }

    
    @keyframes skel-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .stat.skeleton .ic { background: rgba(255,255,255,0.08); box-shadow: none; }
    .skel-bar { border-radius: 5px; background: rgba(255,255,255,0.1); animation: skel-pulse 1.3s ease-in-out infinite; }
    .skel-bar-lbl { width: 64px; height: 9px; margin-bottom: 8px; }
    .skel-bar-val { width: 88px; height: 19px; }
    @media (prefers-reduced-motion: reduce) { .skel-bar { animation: none; } }
  </style>
</head>
<body>
  <div class="launcher">
    
    <div class="lch-metrics" id="metricsRow"></div>

    
    <button class="new-sale" onclick="navigate('pos')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      New Sale
    </button>

    
    <div class="tile-grid">
      <div id="dynTiles" style="display:contents"></div>

      <button class="tile tile-settings" id="settingsBtn" onclick="navigate('settings')" style="display:none">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
        <div><div class="t-title">Settings</div><div class="t-sub">Terminal &amp; store config</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile exit" id="logoutBtn">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
        <div><div class="t-title">Log Out</div><div class="t-sub">End your session</div></div>
      </button>
    </div>
  </div>

  
  <button class="fullscreen-btn" id="fullscreenBtn" data-tooltip="Toggle fullscreen (F11)" aria-label="Toggle fullscreen">
    <svg id="fsIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
    </svg>
  </button>

  
  <div class="status-bar">
    <div class="status-left" id="status-left"></div>
    <div class="status-right" id="status-right"></div>
  </div>

  <script src="../shared.js"></script>
  <script src="../shared-ui-kit.js"></script>
  <script src="../lib/updateUi.js"></script>
  <script>
    const FS_EXPAND = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
    const FS_COMPRESS = `<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>`;
    let isFullscreen = false;
    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      isFullscreen = await window.api.toggleFullscreen();
      document.getElementById('fsIcon').innerHTML = isFullscreen ? FS_COMPRESS : FS_EXPAND;
    });

    let currentRole = null;
    let latestOverview = null;
    let currentSlots = null; 
    let currentMenuAccess = {};
    let currentCanViewReports = false;
    let lastLayoutSig = null; 
    let layoutLoaded = false; 

    
    
    const METRIC_CATALOG = {
      revenue:         { label: 'Revenue',          cls: 'revenue', icon: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>', fmt: (ov) => fmt(ov.revenue) },
      profit:          { label: 'Profit',           cls: 'profit',  icon: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>', fmt: (ov) => fmt(ov.profit) },
      sales:           { label: 'Sales today',      cls: 'sales',   icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>', fmt: (ov) => ov.sale_count },
      avg_ticket:      { label: 'Avg ticket',       cls: 'sales',   icon: '<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>', fmt: (ov) => fmt(ov.avg_ticket ?? (ov.sale_count ? ov.revenue / ov.sale_count : 0)) },
      tax_collected:   { label: 'Tax collected',    cls: 'sales',   icon: '<path d="M12 2 3 7v6c0 5 4 9 9 9s9-4 9-9V7z"/>', fmt: (ov) => fmt(ov.tax_collected ?? 0) },
      discounts_given: { label: 'Discounts given',  cls: 'profit',  icon: '<path d="M20.59 13.41 11 22 2 13l9-9h9z"/><circle cx="7" cy="7" r="1.2"/>', fmt: (ov) => fmt(ov.discounts_given ?? 0) },
      refunds_today:   { label: 'Refunds / exchanges', cls: 'revenue', icon: '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-9.36L1 10"/>', fmt: (ov) => ov.refunds_today ?? 0 },
    };
    const TILE_CATALOG = {
      receipts:          { target: 'receipts', title: 'Receipts', sub: 'View transactions', menuKey: 'access_receipts', icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>' },
      merchandise:       { target: 'merchandise', title: 'Merchandise', sub: 'Manage inventory', menuKey: 'access_merchandise', icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>' },
      'customer-lookup': { target: 'customer-lookup', title: 'Customer Lookup', sub: 'Find customer info', menuKey: 'access_customer_lookup', icon: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' },
      timeclock:         { target: 'timeclock', title: 'Time Clock', sub: 'Clock in / out', menuKey: null, icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' },
      pickups:           { target: 'pickups', title: 'Online Pickups', sub: 'Web order pickups', menuKey: 'access_pickups', feature: 'web_store', icon: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>' },
      xzout:             { target: 'xz-out', title: 'X / Z Out', sub: 'Close registers', menuKey: null, requiresViewReports: true, cls: 'xzout-btn', icon: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>' },
    };
    const DEFAULT_TILE_ORDER = ['receipts', 'merchandise', 'customer-lookup', 'timeclock', 'pickups', 'xzout'];
    const ARROW = '<polyline points="9 18 15 12 9 6"/>';

    
    
    
    
    
    
    
    
    
    
    function renderMetricSlots(slots, role) {
      const chosen = (Array.isArray(slots) ? slots : []).filter((key) => key && METRIC_CATALOG[key]).slice(0, 3);
      const row = document.getElementById('metricsRow');
      if (!chosen.length) {
        row.style.display = 'none';
        row.innerHTML = '';
        return;
      }
      row.style.display = 'grid';
      row.style.gridTemplateColumns = `repeat(${chosen.length}, 1fr)`;
      row.innerHTML = chosen.map((key) => {
        const m = METRIC_CATALOG[key];
        const val = latestOverview ? m.fmt(latestOverview) : '—';
        return `<div class="stat ${m.cls}">
          <div class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg></div>
          <div><div class="lbl">${m.label}</div><div class="val">${val}</div></div>
        </div>`;
      }).join('');
    }

    
    
    
    
    function renderMetricSkeleton(count = 3) {
      const row = document.getElementById('metricsRow');
      row.style.display = 'grid';
      row.style.gridTemplateColumns = `repeat(${count}, 1fr)`;
      row.innerHTML = Array.from({ length: count }, () => `
        <div class="stat skeleton">
          <div class="ic"></div>
          <div>
            <div class="skel-bar skel-bar-lbl"></div>
            <div class="skel-bar skel-bar-val"></div>
          </div>
        </div>
      `).join('');
    }

    function renderTiles(order, role) {
      const keys = (Array.isArray(order) && order.length ? order : DEFAULT_TILE_ORDER).filter((k) => TILE_CATALOG[k]);
      document.getElementById('dynTiles').innerHTML = keys.map((key) => {
        const t = TILE_CATALOG[key];
        if (t.feature && !isFeatureEnabled(t.feature)) return '';
        if (role !== 'manager' && role !== 'admin') {
          if (t.menuKey && currentMenuAccess[t.menuKey] === false) return '';
          if (t.requiresViewReports && !currentCanViewReports) return '';
        }
        return `<button class="tile tile-${key}${t.cls ? ' ' + t.cls : ''}" onclick="navigate('${t.target}')">
          <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg></div>
          <div><div class="t-title">${t.title}</div><div class="t-sub">${t.sub}</div></div>
          <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${ARROW}</svg></span>
        </button>`;
      }).join('');
    }

    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    renderTiles(DEFAULT_TILE_ORDER, 'manager');
    renderMetricSkeleton();

    async function loadLayout(role) {
      let slots = null, order = null;
      try {
        const r = await window.api.getLayoutConfig(role);
        if (r.success) { slots = r.layout.report_slots; order = r.layout.tile_order; }
      } catch {  }
      const sig = JSON.stringify([slots, order]);
      currentSlots = slots;
      layoutLoaded = true;
      if (sig === lastLayoutSig) return; 
      lastLayoutSig = sig;
      renderMetricSlots(slots, role);
      renderTiles(order, role);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const { session } = await window.api.getSession();
      currentRole = session?.role;

      
      
      
      
      await loadFeatures();

      
      

      if (session?.role === 'manager' || session?.role === 'admin') {
        document.getElementById('settingsBtn').style.display = '';
      } else {
        
        
        
        
        try {
          const me = await window.api.permsMe();
          currentCanViewReports = !!(me.success && me.permissions?.view_reports?.granted);
          currentMenuAccess = (me.success && me.menuAccess) || {};
        } catch {  }
      }

      await loadOverview(session?.role);
      await loadLayout(currentRole);
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await window.api.logout();
        await window.api.navigate('login');
      });
    });

    async function loadOverview(role) {
      
      
      
      
      
      
      
      
      
      
      
      let res = await window.api.getTodayOverviewLocation();
      if (!res.success) res = await window.api.getTodayOverview();
      if (!res.success) return;
      latestOverview = res.overview;
      
      
      
      
      
      if (layoutLoaded) renderMetricSlots(currentSlots, role); 
    }
    
    
    
    setInterval(async () => { await loadOverview(currentRole); }, 15000);
    
    
    
    setInterval(() => loadLayout(currentRole), 45000);
  </script>
</body>
</html>
