<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rackd POS — Main Menu</title>
  <link rel="stylesheet" href="../shared.css" />
  <style>
    /* ===========================================================================
       POS launcher — a single, intentional full-screen grid. Brand system:
       warm-paper ground, charcoal action tiles, one red primary (New Sale),
       red used only as accent + the semantic exit. No dead space.
       =========================================================================== */
    :root {
      --ink: #1c1f24; --charcoal-1: #2f343c; --charcoal-2: #23272d; --charcoal-3: #1c2026;
      --accent: #b01d2e; --accent-bright: #c8283a; --muted: #8a9099; --line: rgba(0,0,0,0.07);
    }
    body { overflow: hidden; }

    .launcher {
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 26px 44px;
    }

    /* ── header: brand + live clock ─────────────────────────────────────────── */
    .lch-header { display: flex; align-items: center; justify-content: space-between; }
    .lch-brand { display: flex; align-items: center; gap: 14px; }
    .lch-brand img { height: 56px; width: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.18)); }
    .lch-brand .wordmark {
      font-family: 'Tw Cen MT','Century Gothic','Futura','Gill Sans','Segoe UI',sans-serif;
      font-size: 40px; font-weight: 500; letter-spacing: 5px; line-height: 1;
    }
    .lch-brand .wordmark .d { color: var(--accent); text-shadow: 0 0 14px rgba(176,29,46,0.55); }
    .lch-clock { text-align: right; }
    .lch-clock .day { font-size: 15px; font-weight: 700; color: var(--ink); }
    .lch-clock .who { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    /* ── metrics strip ──────────────────────────────────────────────────────── */
    .lch-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .stat {
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 18px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 8px 22px -14px rgba(0,0,0,0.25);
    }
    .stat .ic { width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto; display: grid; place-items: center; }
    .stat .ic svg { width: 20px; height: 20px; }
    .stat.revenue .ic { background: rgba(70,160,90,0.12); color: #2f8f4e; }
    .stat.profit  .ic { background: rgba(176,29,46,0.10); color: var(--accent); }
    .stat.sales   .ic { background: rgba(40,60,90,0.10);  color: #2f4d7a; }
    .stat .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .stat .val { font-size: 25px; font-weight: 800; color: var(--ink); line-height: 1.05; font-variant-numeric: tabular-nums; }

    /* ── New Sale — the one primary action ──────────────────────────────────── */
    .new-sale {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; height: 66px; border: none; border-radius: 14px; cursor: pointer;
      color: #fff; font-size: 21px; font-weight: 800; letter-spacing: 0.4px;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.05) 3px 4px, transparent 4px 9px, rgba(255,255,255,0.03) 9px 10px),
        linear-gradient(180deg, var(--accent-bright) 0%, var(--accent) 52%, #8f1626 100%);
      box-shadow: 0 4px 16px rgba(176,29,46,0.4), inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.22);
      text-shadow: 0 1px 3px rgba(0,0,0,0.28); transition: filter 0.14s, transform 0.1s;
    }
    .new-sale svg { width: 27px; height: 27px; }
    .new-sale:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .new-sale:active { filter: brightness(0.94); transform: translateY(0); }

    /* ── action tile grid — fills the rest of the screen ────────────────────── */
    .tile-grid {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 1fr;
      gap: 14px;
    }
    .tile {
      position: relative; overflow: hidden; cursor: pointer; text-align: left;
      border: none; border-radius: 14px; padding: 18px 20px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.035) 3px 4px, transparent 4px 9px, rgba(255,255,255,0.02) 9px 10px),
        linear-gradient(180deg, var(--charcoal-1) 0%, var(--charcoal-2) 52%, var(--charcoal-3) 100%);
      box-shadow: 0 6px 18px -8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.28);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: 0; transition: opacity 0.12s; }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -10px rgba(0,0,0,0.55); }
    .tile:hover::before { opacity: 1; }
    .tile:active { transform: translateY(-1px); }
    .tile .t-ic {
      width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center;
      background: rgba(176,29,46,0.16); border: 1px solid rgba(176,29,46,0.28);
    }
    .tile .t-ic svg { width: 26px; height: 26px; color: #f0a6ae; }
    .tile .t-title { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.15; }
    .tile .t-sub { font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 2px; }
    .tile .t-arrow { position: absolute; top: 16px; right: 16px; color: rgba(255,255,255,0.3); }
    .tile .t-arrow svg { width: 18px; height: 18px; }
    /* Log Out — semantic muted-red exit, its accent rail always visible. */
    .tile.exit { background: linear-gradient(180deg, #5a2222 0%, #481a1a 52%, #3a1414 100%); }
    .tile.exit::before { opacity: 1; }
    .tile.exit .t-ic { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.14); }
    .tile.exit .t-ic svg { color: #f2c0bc; }

    /* Fullscreen toggle */
    .fullscreen-btn {
      position: fixed; top: 10px; right: 12px; z-index: 300;
      background: rgba(27,30,34,0.78); border: 1px solid rgba(255,255,255,0.14); border-radius: 5px;
      color: rgba(255,255,255,0.7); cursor: pointer; padding: 0; width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; backdrop-filter: blur(4px);
    }
    .fullscreen-btn:hover { background: rgba(176,29,46,0.9); color: #fff; }
    .fullscreen-btn svg { width: 15px; height: 15px; }

    @media (max-height: 720px) { .tile .t-ic { width: 44px; height: 44px; } .new-sale { height: 58px; } }
    @media (prefers-reduced-motion: reduce) { .tile, .new-sale { transition: none; } }
  </style>
</head>
<body>
  <div class="launcher">
    <!-- Header -->
    <div class="lch-header">
      <div class="lch-brand">
        <img src="../../../assets/logo-mark-dark.svg" alt="" />
        <span class="wordmark"><span style="color:#23272d">Rack</span><span class="d">D</span></span>
      </div>
      <div class="lch-clock">
        <div class="day" id="clockDay">—</div>
        <div class="who" id="clockWho"></div>
      </div>
    </div>

    <!-- Today's metrics -->
    <div class="lch-metrics">
      <div class="stat revenue">
        <div class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <div><div class="lbl">Revenue</div><div class="val" id="metricRevenue">—</div></div>
      </div>
      <div class="stat profit" id="metricProfitChip">
        <div class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
        <div><div class="lbl">Profit</div><div class="val" id="metricProfit">—</div></div>
      </div>
      <div class="stat sales">
        <div class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
        <div><div class="lbl">Sales today</div><div class="val" id="metricSales">—</div></div>
      </div>
    </div>

    <!-- Primary action -->
    <button class="new-sale" onclick="navigate('pos')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      New Sale
    </button>

    <!-- Action tiles -->
    <div class="tile-grid">
      <button class="tile" onclick="navigate('receipts')">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>
        <div><div class="t-title">Receipts</div><div class="t-sub">View transactions</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile" onclick="navigate('merchandise')">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
        <div><div class="t-title">Merchandise</div><div class="t-sub">Manage inventory</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile" onclick="navigate('customer-lookup')">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div><div class="t-title">Customer Lookup</div><div class="t-sub">Find customer info</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile" onclick="navigate('timeclock')">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
        <div><div class="t-title">Time Clock</div><div class="t-sub">Clock in / out</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile" onclick="navigate('pickups')">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
        <div><div class="t-title">Online Pickups</div><div class="t-sub">BOPIS order queue</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile xzout-btn" onclick="navigate('xz-out')">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
        <div><div class="t-title">X / Z Out</div><div class="t-sub">Close registers</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile" id="settingsBtn" onclick="navigate('settings')" style="display:none">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
        <div><div class="t-title">Settings</div><div class="t-sub">Terminal &amp; store config</div></div>
        <span class="t-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button class="tile exit" id="logoutBtn">
        <div class="t-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
        <div><div class="t-title">Log Out</div><div class="t-sub">End your session</div></div>
      </button>
    </div>
  </div>

  <!-- Fullscreen toggle -->
  <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen (F11)">
    <svg id="fsIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
    </svg>
  </button>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-left" id="status-left">Loading…</div>
    <div class="status-right" id="status-right"></div>
  </div>

  <script src="../shared.js"></script>
  <script src="../lib/updateUi.js"></script>
  <script>
    const FS_EXPAND = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
    const FS_COMPRESS = `<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>`;
    let isFullscreen = false;
    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      isFullscreen = await window.api.toggleFullscreen();
      document.getElementById('fsIcon').innerHTML = isFullscreen ? FS_COMPRESS : FS_EXPAND;
    });

    let currentRole = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const { session } = await window.api.getSession();
      currentRole = session?.role;
      // Header: date + who's signed in.
      document.getElementById('clockDay').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      if (session?.username) document.getElementById('clockWho').textContent = `${session.username} · ${session.role || ''}`;

      if (session?.role === 'manager' || session?.role === 'admin') {
        document.getElementById('settingsBtn').style.display = '';
      } else {
        // Cashier: no profit metric; X/Z Out only with the view_reports grant.
        document.getElementById('metricProfitChip').style.display = 'none';
        let canView = false;
        try { const me = await window.api.permsMe(); canView = !!(me.success && me.permissions?.view_reports?.granted); } catch { /* deny */ }
        if (!canView) document.querySelector('.xzout-btn')?.style.setProperty('display', 'none', 'important');
      }

      await loadOverview(session?.role);
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await window.api.logout();
        await window.api.navigate('login');
      });
    });

    async function loadOverview(role) {
      const res = await window.api.getTodayOverview();
      if (!res.success) return;
      const ov = res.overview;
      document.getElementById('metricRevenue').textContent = fmt(ov.revenue);
      if (role === 'manager' || role === 'admin') document.getElementById('metricProfit').textContent = fmt(ov.profit);
      document.getElementById('metricSales').textContent = ov.sale_count;
    }
    setInterval(() => loadOverview(currentRole), 30000);
  </script>
</body>
</html>
